<svg width="100%" viewBox="0 0 690 788" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title>NeRF MLP architecture</title><desc>The positional encoding passes through eight dense layers, with a skip connection after the fifth. A density output and a bottleneck branch off; the bottleneck is concatenated with the direction encoding and passes through one dense layer to give RGB, which is finally concatenated with the density into a four-dimensional output.</desc>
