name: Refresh DVOL data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-dvol
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mainline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch public Deribit data
        run: python scripts/update_dvol.py
      - name: Save the snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/btc-dvol.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh BTC DVOL snapshot'
            git pull --rebase origin mainline
            git push origin HEAD:mainline
          fi
      # GITHUB_TOKEN commits do not automatically trigger this branch-based Pages build.
      - name: Publish the refreshed data on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
