name: Mobile Layout QA Test

on:
  push:
    branches: [ mainline, main ]
  pull_request:
    branches: [ mainline, main ]

jobs:
  test-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mobile Layout QA Test
        run: |
          python3 scripts/test_mobile_layout.py
